<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -150 1750 1800">
  <defs>
    <!-- Glow ellipses: radial gradients, center ~0.5 opacity, fade to transparent -->
    <radialGradient id="gDie">
      <stop offset="0%" stop-color="#60e8f8" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#40d0e0" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#20a0b0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10808a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gTop">
      <stop offset="0%" stop-color="#70ecfa" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#50d8e8" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#2098a8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#107888" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBot">
      <stop offset="0%" stop-color="#65e6f6" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#48d2e2" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#2098a8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#107888" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gStem">
      <stop offset="0%" stop-color="#55e0f0" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#38c0d0" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1a90a0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#107080" stop-opacity="0"/>
    </radialGradient>
    <!-- Shadow filter for scroll dark presence -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="s"/>
      <feMerge>
        <feMergeNode in="s"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

