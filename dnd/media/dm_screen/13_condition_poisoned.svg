<svg xmlns="http://www.w3.org/2000/svg" width="56" height="50" viewBox="0 0 56 50">
            <defs><linearGradient id="coneG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e8c4c4" stop-opacity="0.6"/><stop offset="100%" stop-color="#8b1a1a" stop-opacity="0.1"/></linearGradient></defs>
            <!-- filled front face -->
            <polygon points="4,25 50,6 50,44" fill="url(#coneG)" stroke="none"/>
            <!-- solid front edges -->
            <line x1="4" y1="25" x2="50" y2="6" stroke="#8b1a1a" stroke-width="1.5"/>
            <line x1="4" y1="25" x2="50" y2="44" stroke="#8b1a1a" stroke-width="1.5"/>
            <line x1="50" y1="6" x2="50" y2="44" stroke="#8b1a1a" stroke-width="1.5"/>
            <!-- dashed back edges (3D depth) -->
            <line x1="4" y1="25" x2="50" y2="14" stroke="#c46060" stroke-width="0.8" stroke-dasharray="2,3"/>
            <line x1="4" y1="25" x2="50" y2="36" stroke="#c46060" stroke-width="0.8" stroke-dasharray="2,3"/>
            <!-- dashed vertical back edge at mouth -->
            <line x1="50" y1="14" x2="50" y2="36" stroke="#c46060" stroke-width="0.8" stroke-dasharray="2,3"/>
            <circle cx="4" cy="25" r="3" fill="#8b1a1a"/>
            <text x="30" y="28" text-anchor="middle" font-size="7" fill="#6b1515" font-weight="700">L</text>
          </svg>
