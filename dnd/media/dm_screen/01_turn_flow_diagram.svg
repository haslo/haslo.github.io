<svg xmlns="http://www.w3.org/2000/svg" width="210" height="210" viewBox="0 0 210 210" style="display:block;">
  <!-- START OF TURN -->
  <rect x="25" y="2" width="160" height="20" rx="10" fill="#b8dbc5" stroke="#2d5a3d" stroke-width="1.2"/>
  <text x="105" y="15" text-anchor="middle" font-size="8" fill="#1a4a2a" font-weight="700" font-family="sans-serif">START OF TURN</text>
  <text x="105" y="29" text-anchor="middle" font-size="6.5" fill="#6b5d4f" font-family="sans-serif">Concentration checks, triggered effects</text>

  <!-- Arrow down into pool -->
  <line x1="105" y1="33" x2="105" y2="39" stroke="#6b5d4f" stroke-width="1"/>
  <polygon points="102,38 105,43 108,38" fill="#6b5d4f"/>

  <!-- ANY ORDER pool box -->
  <rect x="18" y="44" width="180" height="118" rx="8" fill="rgba(244,237,228,0.6)" stroke="#c9b99a" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="108" y="57" text-anchor="middle" font-size="6.5" fill="#6b5d4f" font-weight="700" font-family="sans-serif" letter-spacing="1.5">ANY ORDER · INTERLEAVE FREELY</text>

  <!-- Action pill -->
  <rect x="28" y="63" width="76" height="22" rx="3" fill="#e8c4c4" stroke="#8b1a1a" stroke-width="1"/>
  <text x="66" y="78" text-anchor="middle" font-size="8.5" fill="#6b1515" font-weight="700" font-family="sans-serif">ACTION</text>

  <!-- Bonus Action pill -->
  <rect x="112" y="63" width="76" height="22" rx="3" fill="#c5c2e0" stroke="#3b3678" stroke-width="1"/>
  <text x="150" y="78" text-anchor="middle" font-size="8.5" fill="#2d2960" font-weight="700" font-family="sans-serif">BONUS ACTION</text>

  <!-- Move pill — two lines -->
  <rect x="28" y="92" width="160" height="28" rx="3" fill="#dfc9a8" stroke="#6b4226" stroke-width="1"/>
  <text x="108" y="105" text-anchor="middle" font-size="8.5" fill="#5a3a14" font-weight="700" font-family="sans-serif">MOVE</text>
  <text x="108" y="115" text-anchor="middle" font-size="7" fill="#5a3a14" font-family="sans-serif">can split around other actions</text>

  <!-- Free Interaction pill -->
  <rect x="28" y="127" width="160" height="28" rx="3" fill="rgba(107,66,38,0.08)" stroke="#c9b99a" stroke-width="1"/>
  <text x="108" y="140" text-anchor="middle" font-size="8" fill="#6b4226" font-weight="600" font-family="sans-serif">FREE INTERACTION</text>
  <text x="108" y="150" text-anchor="middle" font-size="7" fill="#6b4226" font-family="sans-serif">draw/stow weapon, open door, etc.</text>

  <!-- Arrow down out of pool -->
  <line x1="105" y1="163" x2="105" y2="169" stroke="#6b5d4f" stroke-width="1"/>
  <polygon points="102,168 105,173 108,168" fill="#6b5d4f"/>

  <!-- END OF TURN -->
  <rect x="25" y="174" width="160" height="20" rx="10" fill="#e8c4c4" stroke="#8b1a1a" stroke-width="1.2"/>
  <text x="105" y="187" text-anchor="middle" font-size="8" fill="#6b1515" font-weight="700" font-family="sans-serif">END OF TURN</text>
  <text x="105" y="201" text-anchor="middle" font-size="6.5" fill="#6b5d4f" font-family="sans-serif">Triggered effects, end-of-turn saves</text>

  <!-- REACTION sidebar -->
  <rect x="0" y="44" width="14" height="150" rx="3" fill="#c9dce8" stroke="#2a4d63" stroke-width="0.8"/>
  <text x="7" y="100" text-anchor="middle" font-size="6" fill="#2a4d63" font-weight="700" font-family="sans-serif" transform="rotate(-90 7 100)">REACTION</text>
  <text x="7" y="145" text-anchor="middle" font-size="5.5" fill="#2a4d63" font-family="sans-serif" transform="rotate(-90 7 145)">1/round, on any turn</text>
</svg>
