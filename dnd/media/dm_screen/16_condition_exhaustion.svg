<svg xmlns="http://www.w3.org/2000/svg" width="48" height="50" viewBox="0 0 48 50">
            <defs><linearGradient id="cylG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dfc9a8" stop-opacity="0.5"/><stop offset="50%" stop-color="#dfc9a8" stop-opacity="0.25"/><stop offset="100%" stop-color="#6b4226" stop-opacity="0.12"/></linearGradient></defs>
            <!-- body fill -->
            <rect x="4" y="11" width="40" height="28" fill="url(#cylG)" stroke="none"/>
            <!-- solid side edges -->
            <line x1="4" y1="11" x2="4" y2="39" stroke="#6b4226" stroke-width="1.5"/>
            <line x1="44" y1="11" x2="44" y2="39" stroke="#6b4226" stroke-width="1.5"/>
            <!-- top ellipse — dashed (back face) -->
            <ellipse cx="24" cy="11" rx="20" ry="6" fill="#dfc9a8" fill-opacity="0.2" stroke="#6b4226" stroke-width="1" stroke-dasharray="2,3"/>
            <!-- bottom ellipse — solid (front face) -->
            <ellipse cx="24" cy="39" rx="20" ry="6" fill="#dfc9a8" fill-opacity="0.35" stroke="#6b4226" stroke-width="1.5"/>
            <!-- vertical center dashed -->
            <line x1="24" y1="11" x2="24" y2="39" stroke="#6b4226" stroke-width="0.6" stroke-dasharray="2,3"/>
            <circle cx="24" cy="39" r="2.5" fill="#6b4226"/>
            <text x="40" y="27" font-size="7" fill="#5a3a14" font-weight="700">H</text>
          </svg>
