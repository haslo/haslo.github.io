<svg xmlns="http://www.w3.org/2000/svg" width="52" height="50" viewBox="0 0 52 50">
            <defs><linearGradient id="cubeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b8dbc5" stop-opacity="0.5"/><stop offset="100%" stop-color="#2d5a3d" stop-opacity="0.1"/></linearGradient></defs>
            <!-- front face filled -->
