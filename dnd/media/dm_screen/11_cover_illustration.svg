<svg xmlns="http://www.w3.org/2000/svg" width="90" height="44" viewBox="0 0 90 44" class="flex-shrink-0">
          <!-- Half cover -->
          <rect x="2" y="22" width="8" height="20" rx="1" fill="#dfc9a8" stroke="#6b4226" stroke-width="1"/>
          <circle cx="6" cy="14" r="4" fill="none" stroke="#2d5a3d" stroke-width="1.2"/>
          <line x1="6" y1="18" x2="6" y2="30" stroke="#2d5a3d" stroke-width="1.2"/>
          <line x1="1" y1="23" x2="11" y2="23" stroke="#2d5a3d" stroke-width="1"/>
          <text x="6" y="7" text-anchor="middle" font-size="6" fill="#6b4226" font-weight="700">½</text>
          <!-- ¾ cover -->
          <rect x="32" y="12" width="8" height="30" rx="1" fill="#dfc9a8" stroke="#6b4226" stroke-width="1"/>
          <circle cx="36" cy="14" r="4" fill="none" stroke="#2d5a3d" stroke-width="1.2"/>
          <line x1="36" y1="18" x2="36" y2="30" stroke="#2d5a3d" stroke-width="1.2" stroke-dasharray="1,2"/>
          <text x="36" y="7" text-anchor="middle" font-size="6" fill="#6b4226" font-weight="700">¾</text>
          <!-- Total cover -->
          <rect x="62" y="4" width="8" height="38" rx="1" fill="#dfc9a8" stroke="#6b4226" stroke-width="1"/>
          <circle cx="66" cy="14" r="4" fill="none" stroke="#2d5a3d" stroke-width="1.2" stroke-dasharray="1,2" opacity="0.4"/>
          <line x1="66" y1="18" x2="66" y2="30" stroke="#2d5a3d" stroke-width="1.2" stroke-dasharray="1,2" opacity="0.4"/>
          <text x="66" y="7" text-anchor="middle" font-size="5" fill="#6b4226" font-weight="700">Full</text>
          <!-- arrows from left -->
          <line x1="20" y1="20" x2="14" y2="20" stroke="#8b1a1a" stroke-width="0.8" marker-end="none"/>
          <polygon points="14,18 10,20 14,22" fill="#8b1a1a"/>
          <line x1="50" y1="20" x2="44" y2="20" stroke="#8b1a1a" stroke-width="0.8"/>
          <polygon points="44,18 40,20 44,22" fill="#8b1a1a"/>
          <line x1="80" y1="20" x2="74" y2="20" stroke="#8b1a1a" stroke-width="0.8"/>
          <polygon points="74,18 70,20 74,22" fill="#8b1a1a"/>
          <!-- x on total -->
          <line x1="76" y1="16" x2="82" y2="24" stroke="#8b1a1a" stroke-width="1.5"/>
          <line x1="82" y1="16" x2="76" y2="24" stroke="#8b1a1a" stroke-width="1.5"/>
        </svg>
