<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7baad4"/><stop offset="35%" stop-color="#b0c8dc"/>
      <stop offset="65%" stop-color="#ccc0a8"/><stop offset="100%" stop-color="#2a1c14"/>
    </linearGradient>
    <linearGradient id="tw1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e0d4c0"/><stop offset="100%" stop-color="#887862"/></linearGradient>
    <linearGradient id="tw2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d0c4b0"/><stop offset="100%" stop-color="#786852"/></linearGradient>
    <filter id="fog"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>

  <rect width="480" height="560" fill="url(#sky)"/>

  <!-- Clouds -->
  <g opacity="0.25" filter="url(#fog)">
    <ellipse cx="90" cy="150" rx="65" ry="10" fill="white"/>
    <ellipse cx="370" cy="110" rx="50" ry="8" fill="white"/>
    <ellipse cx="240" cy="190" rx="80" ry="12" fill="white"/>
    <ellipse cx="130" cy="340" rx="55" ry="7" fill="#c8b8a0"/>
  </g>

  <!-- Background towers -->
  <g opacity="0.35">
    <rect x="55" y="55" width="26" height="465" fill="#928272" rx="2"/>
    <rect x="395" y="75" width="30" height="445" fill="#928272" rx="2"/>
    <rect x="165" y="35" width="22" height="485" fill="#9a8a7a" rx="2"/>
    <rect x="300" y="45" width="24" height="475" fill="#9a8a7a" rx="2"/>
  </g>

  <!-- Main towers -->
  <rect x="105" y="25" width="38" height="495" fill="url(#tw1)" rx="3"/>
  <rect x="195" y="65" width="42" height="455" fill="url(#tw2)" rx="3"/>
  <rect x="250" y="15" width="36" height="505" fill="url(#tw1)" rx="3"/>
  <rect x="335" y="50" width="40" height="470" fill="url(#tw2)" rx="3"/>

  <!-- Window lights -->
  <g fill="#b8860b" opacity="0.45">
    <rect x="113" y="55" width="2.5" height="2.5" rx=".5"/><rect x="124" y="55" width="2.5" height="2.5" rx=".5"/><rect x="133" y="55" width="2.5" height="2.5" rx=".5"/>
    <rect x="113" y="85" width="2.5" height="2.5" rx=".5"/><rect x="124" y="85" width="2.5" height="2.5" rx=".5"/><rect x="133" y="85" width="2.5" height="2.5" rx=".5"/>
    <rect x="113" y="115" width="2.5" height="2.5" rx=".5"/><rect x="124" y="115" width="2.5" height="2.5" rx=".5"/><rect x="133" y="115" width="2.5" height="2.5" rx=".5"/>
    <rect x="113" y="155" width="2.5" height="2.5" rx=".5"/><rect x="124" y="155" width="2.5" height="2.5" rx=".5"/><rect x="133" y="155" width="2.5" height="2.5" rx=".5"/>
    <rect x="258" y="45" width="2.5" height="2.5" rx=".5"/><rect x="268" y="45" width="2.5" height="2.5" rx=".5"/><rect x="278" y="45" width="2.5" height="2.5" rx=".5"/>
    <rect x="258" y="75" width="2.5" height="2.5" rx=".5"/><rect x="268" y="75" width="2.5" height="2.5" rx=".5"/><rect x="278" y="75" width="2.5" height="2.5" rx=".5"/>
    <rect x="258" y="105" width="2.5" height="2.5" rx=".5"/><rect x="268" y="105" width="2.5" height="2.5" rx=".5"/><rect x="278" y="105" width="2.5" height="2.5" rx=".5"/>
    <rect x="258" y="150" width="2.5" height="2.5" rx=".5"/><rect x="268" y="150" width="2.5" height="2.5" rx=".5"/><rect x="278" y="150" width="2.5" height="2.5" rx=".5"/>
    <rect x="343" y="80" width="2.5" height="2.5" rx=".5"/><rect x="354" y="80" width="2.5" height="2.5" rx=".5"/><rect x="365" y="80" width="2.5" height="2.5" rx=".5"/>
    <rect x="343" y="115" width="2.5" height="2.5" rx=".5"/><rect x="354" y="115" width="2.5" height="2.5" rx=".5"/><rect x="365" y="115" width="2.5" height="2.5" rx=".5"/>
  </g>

  <!-- Bridges -->
  <g stroke="#a09080" stroke-width="1.8" fill="none" opacity="0.65">
    <path d="M143,170 Q168,165 195,170"/><path d="M237,230 Q244,226 250,230"/>
    <path d="M286,150 Q310,145 335,150"/><path d="M143,310 Q175,305 195,310"/>
    <path d="M286,340 Q308,335 335,340"/><path d="M237,410 Q244,406 250,410"/>
  </g>

  <!-- Skycoaches -->
  <g opacity="0.55">
    <ellipse cx="170" cy="125" rx="7" ry="2.5" fill="#b8860b" transform="rotate(-8,170,125)"/>
    <ellipse cx="320" cy="240" rx="6" ry="2" fill="#8b6500" transform="rotate(5,320,240)"/>
  </g>

  <!-- Airship -->
  <g transform="translate(360,35)" opacity="0.45">
    <ellipse rx="28" ry="7" fill="#6a5a48"/><rect x="-10" y="7" width="20" height="9" rx="2" fill="#5a4a38"/>
    <line x1="-8" y1="7" x2="-13" y2="0" stroke="#5a4a38" stroke-width="0.7"/>
    <line x1="8" y1="7" x2="13" y2="0" stroke="#5a4a38" stroke-width="0.7"/>
  </g>

  <!-- STRATUM LABELS -->
  <g font-family="Cinzel,serif" letter-spacing="1.5" text-anchor="end">
    <line x1="388" y1="62" x2="443" y2="62" stroke="#8b2500" stroke-width="0.4" opacity="0.5"/>
    <text x="478" y="56" font-size="7" fill="#8b2500" opacity="0.85">SKYWAY</text>
    <text x="478" y="66" font-size="5.5" fill="#6b5e50" font-family="Crimson Pro,serif" letter-spacing="0">Floating towers, the ultra-rich</text>

    <line x1="388" y1="150" x2="443" y2="150" stroke="#8b2500" stroke-width="0.4" opacity="0.5"/>
    <text x="478" y="144" font-size="7" fill="#8b2500" opacity="0.85">UPPER CITY</text>
    <text x="478" y="154" font-size="5.5" fill="#6b5e50" font-family="Crimson Pro,serif" letter-spacing="0">Nobles, dragonmarks, politics</text>

    <line x1="388" y1="255" x2="443" y2="255" stroke="#8b2500" stroke-width="0.4" opacity="0.5"/>
    <text x="478" y="249" font-size="7" fill="#8b2500" opacity="0.85">MIDDLE CITY</text>
    <text x="478" y="259" font-size="5.5" fill="#6b5e50" font-family="Crimson Pro,serif" letter-spacing="0">Markets, taverns, most people</text>

    <line x1="388" y1="365" x2="443" y2="365" stroke="#8b2500" stroke-width="0.4" opacity="0.5"/>
    <text x="478" y="359" font-size="7" fill="#8b2500" opacity="0.85">LOWER CITY</text>
    <text x="478" y="369" font-size="5.5" fill="#6b5e50" font-family="Crimson Pro,serif" letter-spacing="0">Crime, poverty, the desperate</text>

    <line x1="388" y1="450" x2="443" y2="450" stroke="#8b2500" stroke-width="0.4" opacity="0.5"/>
    <text x="478" y="444" font-size="7" fill="#8b2500" opacity="0.85">THE DEPTHS</text>
    <text x="478" y="454" font-size="5.5" fill="#6b5e50" font-family="Crimson Pro,serif" letter-spacing="0">Ruins, monsters, the forgotten</text>

    <line x1="388" y1="520" x2="443" y2="520" stroke="#8b2500" stroke-width="0.4" opacity="0.5"/>
    <text x="478" y="514" font-size="7" fill="#8b2500" opacity="0.85">THE COGS</text>
    <text x="478" y="524" font-size="5.5" fill="#6b5e50" font-family="Crimson Pro,serif" letter-spacing="0">Foundries, forges, warforged ghettos</text>
  </g>

  <!-- Ground / Cogs -->
  <rect x="0" y="520" width="480" height="40" fill="#2a1c14"/>
  <g opacity="0.3"><rect x="90" y="525" width="280" height="28" fill="#3a1a0a" rx="2"/><ellipse cx="170" cy="538" rx="14" ry="3.5" fill="#8b2500"/><ellipse cx="280" cy="540" rx="11" ry="3" fill="#8b2500"/></g>
</svg>
