<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <style>
      .shard-label { font-size: 10px; font-family: serif; fill: #6b5e50; text-anchor: middle; }
      .shard-outline { stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="100" fill="transparent"/>
  
  <!-- SIBERYS SHARD (Golden, left) -->
  <g id="siberys-group">
    <!-- Main crystal form (elongated hexagon) -->
    <polygon points="45,25 55,15 65,15 75,25 70,45 50,45" fill="#b8860b" class="shard-outline" stroke="#c4b8a8"/>
    <polygon points="45,25 55,15 65,15 75,25 70,45 50,45" fill="none" stroke="#c4b8a8" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Radiating lines (glow effect) -->
    <line x1="60" y1="10" x2="60" y2="2" stroke="#b8860b" stroke-width="0.8" opacity="0.7"/>
    <line x1="78" y1="30" x2="85" y2="30" stroke="#b8860b" stroke-width="0.8" opacity="0.7"/>
    <line x1="70" y1="48" x2="75" y2="54" stroke="#b8860b" stroke-width="0.8" opacity="0.7"/>
    <line x1="45" y1="48" x2="40" y2="54" stroke="#b8860b" stroke-width="0.8" opacity="0.7"/>
    <line x1="42" y1="30" x2="35" y2="30" stroke="#b8860b" stroke-width="0.8" opacity="0.7"/>
    
    <!-- Label -->
    <text x="60" y="75" class="shard-label">Siberys</text>
  </g>
  
  <!-- EBERRON SHARD (Rose/Pink, center) -->
  <g id="eberron-group">
    <!-- Main crystal form (elongated hexagon) -->
    <polygon points="145,25 155,15 165,15 175,25 170,45 150,45" fill="#d9a89c" class="shard-outline" stroke="#c4b8a8"/>
    <polygon points="145,25 155,15 165,15 175,25 170,45 150,45" fill="none" stroke="#c4b8a8" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Radiating lines -->
    <line x1="160" y1="10" x2="160" y2="2" stroke="#d9a89c" stroke-width="0.8" opacity="0.7"/>
    <line x1="178" y1="30" x2="185" y2="30" stroke="#d9a89c" stroke-width="0.8" opacity="0.7"/>
    <line x1="170" y1="48" x2="175" y2="54" stroke="#d9a89c" stroke-width="0.8" opacity="0.7"/>
    <line x1="145" y1="48" x2="140" y2="54" stroke="#d9a89c" stroke-width="0.8" opacity="0.7"/>
    <line x1="142" y1="30" x2="135" y2="30" stroke="#d9a89c" stroke-width="0.8" opacity="0.7"/>
    
    <!-- Label -->
    <text x="160" y="75" class="shard-label">Eberron</text>
  </g>
  
  <!-- KHYBER SHARD (Dark blue-purple, right) -->
  <g id="khyber-group">
    <!-- Main crystal form (elongated hexagon) -->
    <polygon points="245,25 255,15 265,15 275,25 270,45 250,45" fill="#3d2b5c" class="shard-outline" stroke="#c4b8a8"/>
    <polygon points="245,25 255,15 265,15 275,25 270,45 250,45" fill="none" stroke="#c4b8a8" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Radiating lines -->
    <line x1="260" y1="10" x2="260" y2="2" stroke="#5d4b7c" stroke-width="0.8" opacity="0.7"/>
    <line x1="278" y1="30" x2="285" y2="30" stroke="#5d4b7c" stroke-width="0.8" opacity="0.7"/>
    <line x1="270" y1="48" x2="275" y2="54" stroke="#5d4b7c" stroke-width="0.8" opacity="0.7"/>
    <line x1="245" y1="48" x2="240" y2="54" stroke="#5d4b7c" stroke-width="0.8" opacity="0.7"/>
    <line x1="242" y1="30" x2="235" y2="30" stroke="#5d4b7c" stroke-width="0.8" opacity="0.7"/>
    
    <!-- Label -->
    <text x="260" y="75" class="shard-label">Khyber</text>
  </g>
</svg>
